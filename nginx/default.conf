# ========================================================
# CẤU HÌNH NGINX REVERSE PROXY & HARDENING BẢO MẬT (ĐỀ 10)
# ========================================================

# Khai báo zone giới hạn tốc độ truy cập (Rate Limiting chống DDoS)
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # ================= 1. SECURITY HARDENING =================
    # Ẩn thông tin phiên bản Nginx trong HTTP Header
    server_tokens off;

    # Cấu hình Security Headers chống Clickjacking, MIME sniffing, XSS
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Giới hạn kích thước gói tin gửi lên để phòng chống tấn công tràn bộ đệm (Buffer Overflow)
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ================= 2. REVERSE PROXY: HRM APP =================
    location / {
        limit_req zone=general_limit burst=30 nodelay;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # Forward các header nhận diện client thực
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ WebSockets / SSE nếu có
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Giới hạn chặt hơn cho các API gửi dữ liệu
    location /api/ {
        limit_req zone=api_limit burst=15 nodelay;

        proxy_pass http://app:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ================= 3. REVERSE PROXY: PGADMIN =================
    location /pgadmin/ {
        proxy_pass http://pgadmin:80/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Trang báo lỗi thân thiện khi vượt quá giới hạn rate limit (429)
    error_page 429 /429.html;
    location = /429.html {
        return 429 '{"error": "Too Many Requests", "message": "Ban da gui qua nhieu yeu cau trong mot thoi gian ngan. Vui long thu lai sau."}';
        default_type application/json;
    }
}
