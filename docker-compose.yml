version: '3.8'

services:
  # ========================================================
  # 1. CƠ SỞ DỮ LIỆU POSTGRESQL & PGADMIN
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: hrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrm_user
      POSTGRES_PASSWORD: hrm_password123
      POSTGRES_DB: hrm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrm_user -d hrm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hrm-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hrm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hrm.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hrm-network

  # ========================================================
  # 2. ỨNG DỤNG HRM (NODE.JS EXPRESS + PROMETHEUS METRICS)
  # ========================================================
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: hrm-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hrm_user
      DB_PASSWORD: hrm_password123
      DB_NAME: hrm_db
      LOG_DIR: /var/log/app
    volumes:
      - app_logs:/var/log/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hrm-network

  # ========================================================
  # 3. NGINX REVERSE PROXY & HARDENING
  # ========================================================
  nginx:
    image: nginx:alpine
    container_name: hrm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - pgadmin
    networks:
      - hrm-network

  # ========================================================
  # 4. GIÁM SÁT CHỈ SỐ: PROMETHEUS & GRAFANA
  # ========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: hrm-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - hrm-network

  grafana:
    image: grafana/grafana:latest
    container_name: hrm-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - hrm-network

  # ========================================================
  # 5. THU THẬP & TRUY VẤN LOG: LOKI + PROMTAIL (LOGQL)
  # ========================================================
  loki:
    image: grafana/loki:latest
    container_name: hrm-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - hrm-network

  promtail:
    image: grafana/promtail:latest
    container_name: hrm-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - app_logs:/var/log/app:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
      - app
    networks:
      - hrm-network

# ========================================================
# VOLUMES & NETWORKS
# ========================================================
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  app_logs:

networks:
  hrm-network:
    driver: bridge
